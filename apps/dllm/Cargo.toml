[package]
name = "dllm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dllm"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
mdns-sd = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
dllm-core = { path = "../../crates/dllm-core" }
dllm-net = { path = "../../crates/dllm-net" }
dllm-store = { path = "../../crates/dllm-store" }
dllm-serve = { path = "../../crates/dllm-serve" }
# Runtime loading + dllm rpc-worker for the C++ llama.cpp/ggml-rpc shim.
# Never linked at build time (ADR-032).
dllm-shim = { path = "../../crates/dllm-shim" }
