[package]
name = "dllm-serve"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dllm-core = { path = "../dllm-core" }
dllm-store = { path = "../dllm-store" }
# mTLS QUIC mesh: `spawn_mesh_server` binds 8443 and accepts paired peers, and
# `PeerLink` holds a live `quinn::Connection`, so this is no longer test-only.
dllm-net = { path = "../dllm-net" }
quinn = { workspace = true }
hostname = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
